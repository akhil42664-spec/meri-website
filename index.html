<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dil Ki Awaaz ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #080b12;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

h1 {
    color: #00cfff;
    font-size: 28px;
    margin-bottom: 8px;
}

p {
    color: #ddd;
    margin-bottom: 22px;
}

.poster {
    width: 100%;
    max-width: 350px;
    border: 2px solid #00cfff;
    border-radius: 18px;
    box-shadow: 0 0 25px #00cfff66;
    cursor: pointer;
    transition: transform 0.2s;
}

.poster:active {
    transform: scale(0.97);
}

button {
    margin-top: 22px;
    padding: 14px 30px;
    border: none;
    border-radius: 30px;
    background: #00cfff;
    color: #061018;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

#status {
    margin-top: 15px;
    color: #00cfff;
    font-size: 15px;
}
</style>
</head>

<body>

<h1>Dil Ki Awaaz ❤️</h1>

<p>Touch Here To Listen 🎵</p>

<img
    id="poster"
    class="poster"
    src="file_000000008f7c821182c4b673e41abb67.png"
    alt="Dil Ki Awaaz Poster"
>

<button id="playButton">TAP HERE ❤️</button>

<p id="status">Tumhare liye ek special audio ❤️</p>

<audio id="audio"
    src="Kya hua baccha call kru 🥺 #shorts #ytshort - Sorav Sharma (2).mp3"
    preload="auto">
</audio>

<script>
const poster = document.getElementById("poster");
const button = document.getElementById("playButton");
const audio = document.getElementById("audio");
const status = document.getElementById("status");

let stopTimer;

function playMusic() {
    clearTimeout(stopTimer);

    audio.pause();
    audio.currentTime = 0;

    audio.play()
        .then(() => {
            status.textContent = "Dil ki awaaz suno ❤️";

            stopTimer = setTimeout(() => {
                audio.pause();
                audio.currentTime = 0;
                status.textContent = "Dobara sunne ke liye tap karo ❤️";
            }, 4000);
        })
        .catch(() => {
            status.textContent =
                "Audio nahi chala. Audio file ka naam check karo.";
        });
}

poster.addEventListener("click", playMusic);
button.addEventListener("click", playMusic);
</script>

</body>
</html>
